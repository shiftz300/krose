<line x1="455" y1="117" x2="447.79642318117857" y2="120.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="455" y1="117" x2="447.79642318117857" y2="113.52027572711016" stroke="#647784" stroke-width="1"/>
<line x1="665" y1="117" x2="690" y2="117" stroke="#647784" stroke-width="1"/>
<line x1="690" y1="117" x2="682.7964231811786" y2="120.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="690" y1="117" x2="682.7964231811786" y2="113.52027572711016" stroke="#647784" stroke-width="1"/>
<line x1="450" y1="175" x2="450" y2="215" stroke="#647784" stroke-width="1"/>
<line x1="450" y1="215" x2="446.5202757271102" y2="207.7964231811786" stroke="#647784" stroke-width="1"/>
<line x1="450" y1="215" x2="453.4797242728898" y2="207.7964231811786" stroke="#647784" stroke-width="1"/>
<text x="450" y="237" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#18354a">检查消息头与固定块结构</text>
<line x1="410" y1="250" x2="220" y2="290" stroke="#647784" stroke-width="1"/>
<line x1="220" y1="290" x2="226.33219887581438" y2="285.1109042352256" stroke="#647784" stroke-width="1"/>
<line x1="220" y1="290" x2="227.76591821857207" y2="291.9210711133246" stroke="#647784" stroke-width="1"/>
<line x1="490" y1="250" x2="680" y2="290" stroke="#647784" stroke-width="1"/>
<line x1="680" y1="290" x2="672.2340817814279" y2="291.9210711133246" stroke="#647784" stroke-width="1"/>
<line x1="680" y1="290" x2="673.6678011241856" y2="285.1109042352256" stroke="#647784" stroke-width="1"/>
<rect x="35" y="290" width="370" height="105" rx="5" fill="white" stroke="#237b78"/>
<text x="220.0" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">普通 SysEx</text>
<text x="220.0" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">补上 F0 / F7，去掉 FF 填充</text>
<text x="220.0" y="362" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按轨道开关送往本机字节解析器和两个端口</text>
<rect x="495" y="290" width="370" height="105" rx="5" fill="white" stroke="#a66b27"/>
<text x="680.0" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">KORG 参数消息</text>
<text x="680.0" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">42 3n 00 01 49 41 04 …</text>
<text x="680.0" y="362" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">解出通道、参数组、索引与 32 位值</text>
<text x="450" y="443" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">检查执行原记录读取、分类与路由；本机解析、参数写入及端口缓冲在边界截获。</text>
</svg>