<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">SysEx 由一个事件头、若干数据块和结束块组成</text>
<rect x="25" y="65" width="170" height="104" rx="5" fill="white" stroke="#265d82"/>
<text x="110.0" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">0F · 事件头</text>
<text x="110.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">时间位置 / 标志</text>
<rect x="220" y="65" width="210" height="104" rx="5" fill="white" stroke="#265d82"/>
<text x="325.0" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">07 · 数据块</text>
<text x="325.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">每块 7 个数据字节</text>
<text x="325.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按 +7 → +1 顺序读取</text>
<rect x="455" y="65" width="210" height="104" rx="5" fill="white" stroke="#265d82"/>
<text x="560.0" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">07 · 后续数据块</text>
<text x="560.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">FF 为填充，跳过</text>
<text x="560.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">继续读取到结束块</text>
<rect x="690" y="65" width="185" height="104" rx="5" fill="white" stroke="#265d82"/>
<text x="782.5" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">08 · 结束块</text>
<text x="782.5" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">结束本条记录</text>
<line x1="195" y1="117" x2="220" y2="117" stroke="#647784" stroke-width="1"/>
<line x1="220" y1="117" x2="212.7964231811786" y2="120.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="220" y1="117" x2="212.7964231811786" y2="113.52027572711016" stroke="#647784" stroke-width="1"/>
