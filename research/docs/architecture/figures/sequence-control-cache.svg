<svg xmlns="http://www.w3.org/2000/svg" width="900" height="485" viewBox="0 0 900 485"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="36" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="22" fill="#18354a">控制事件按歌曲位置仲裁，压力与弯音可在队列中合并</text>
<rect x="30" y="70" width="395" height="142" rx="5" fill="white" stroke="#265d82"/>
<text x="227.5" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">通道缓存：同一 CC 已应用到 tick 120</text>
<text x="227.5" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">后来读到 tick 119 → 保留轨道记录，跳过该路输出</text>
<text x="227.5" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">后来读到 tick 120 → 允许再次输出</text>
<text x="227.5" y="162" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">本机、外发两套缓存分别判断</text>
<rect x="475" y="70" width="395" height="142" rx="5" fill="white" stroke="#237b78"/>
<text x="672.5" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">批处理：同轨连续压力值 1 → 2 → 3</text>
<text x="672.5" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">本机队列最终只保留压力值 3</text>
<text x="672.5" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">外发路线仍按顺序输出 1、2、3</text>
<text x="672.5" y="162" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">条件：队列对象 +294 标志已启用</text>
<text x="450" y="263" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#18354a">中间插入音符时：音符前后的压力各保留一个位置</text>
<rect x="40" y="290" width="175" height="94" rx="5" fill="white" stroke="#237b78"/>
<text x="127.5" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">压力 1 → 压力 2</text>
<text x="127.5" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">覆盖同一队列位置</text>
<rect x="255" y="290" width="175" height="94" rx="5" fill="white" stroke="#265d82"/>
<text x="342.5" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">Note On</text>
<text x="342.5" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">清除此轨合并标志</text>
<rect x="470" y="290" width="175" height="94" rx="5" fill="white" stroke="#237b78"/>
<text x="557.5" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">压力 3</text>
<text x="557.5" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">申请新的队列位置</text>
<rect x="685" y="290" width="175" height="94" rx="5" fill="white" stroke="#a66b27"/>
<text x="772.5" y="318" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">本机队列</text>
<text x="772.5" y="342" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">压力 2 → 音符 → 压力 3</text>
<line x1="215" y1="337" x2="255" y2="337" stroke="#647784" stroke-width="1"/>
<line x1="255" y1="337" x2="247.7964231811786" y2="340.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="255" y1="337" x2="247.7964231811786" y2="333.5202757271102" stroke="#647784" stroke-width="1"/>
<line x1="430" y1="337" x2="470" y2="337" stroke="#647784" stroke-width="1"/>
<line x1="470" y1="337" x2="462.79642318117857" y2="340.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="470" y1="337" x2="462.79642318117857" y2="333.5202757271102" stroke="#647784" stroke-width="1"/>
<line x1="645" y1="337" x2="685" y2="337" stroke="#647784" stroke-width="1"/>
<line x1="685" y1="337" x2="677.7964231811786" y2="340.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="685" y1="337" x2="677.7964231811786" y2="333.5202757271102" stroke="#647784" stroke-width="1"/>
<text x="450" y="439" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">原事件解码、缓存比较和队列写入均执行；图中压力值来自合成事件的原 ARM 检查。</text>
</svg>