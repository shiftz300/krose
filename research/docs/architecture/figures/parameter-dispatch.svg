<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="38" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">先切换入队位置，再处理当前参数批次</text>
<rect x="30" y="70" width="230" height="100" rx="5" fill="white" stroke="#265d82"/>
<text x="145.0" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">队列 A：当前批次</text>
<text x="145.0" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">保存待处理记录</text>
<text x="145.0" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">本轮处理完后清空</text>
<rect x="640" y="70" width="230" height="100" rx="5" fill="white" stroke="#237b78"/>
<text x="755.0" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">队列 B：接收新事件</text>
<text x="755.0" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">入队指针先切换到这里</text>
<text x="755.0" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">下一轮与 A 互换</text>
<line x1="270" y1="112" x2="630" y2="112" stroke="#647784" stroke-width="1"/>
<line x1="630" y1="112" x2="622.7964231811786" y2="115.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="630" y1="112" x2="622.7964231811786" y2="108.52027572711016" stroke="#647784" stroke-width="1"/>
<text x="450" y="96" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#18354a">切换入队指针</text>
<line x1="145" y1="170" x2="145" y2="220" stroke="#647784" stroke-width="1"/>
<line x1="145" y1="220" x2="141.52027572711015" y2="212.7964231811786" stroke="#647784" stroke-width="1"/>
<line x1="145" y1="220" x2="148.47972427288985" y2="212.7964231811786" stroke="#647784" stroke-width="1"/>
<rect x="30" y="220" width="230" height="105" rx="5" fill="white" stroke="#265d82"/>
<text x="145.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">逐项分派</text>
<text x="145.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">读取旧值，检查事件类型</text>
<text x="145.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">效果参数先按描述符限幅</text>
<rect x="335" y="220" width="230" height="105" rx="5" fill="white" stroke="#237b78"/>
<text x="450.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">原参数回调</text>
<text x="450.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按字段宽度写入内存</text>
<text x="450.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">再调用 getter 读取新值</text>
<rect x="640" y="220" width="230" height="105" rx="5" fill="white" stroke="#a66b27"/>
<text x="755.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">变更记录</text>
<text x="755.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">参数编号 / 类型 / 标志</text>
<text x="755.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">新读回值 / 旧读回值</text>
<line x1="260" y1="272" x2="335" y2="272" stroke="#647784" stroke-width="1"/>
<line x1="335" y1="272" x2="327.79642318117857" y2="275.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="335" y1="272" x2="327.79642318117857" y2="268.5202757271102" stroke="#647784" stroke-width="1"/>
<line x1="565" y1="272" x2="640" y2="272" stroke="#647784" stroke-width="1"/>
<line x1="640" y1="272" x2="632.7964231811786" y2="275.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="640" y1="272" x2="632.7964231811786" y2="268.5202757271102" stroke="#647784" stroke-width="1"/>
<text x="450" y="388" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#18354a">已执行的例子：命名空间 100，索引 2，范围 0–7</text>
<rect x="75" y="413" width="210" height="70" rx="5" fill="white" stroke="#265d82"/>
<text x="180.0" y="441" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">请求值 255</text>
<text x="180.0" y="465" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">缓存保留 32 位原值</text>
<rect x="345" y="413" width="210" height="70" rx="5" fill="white" stroke="#237b78"/>
<text x="450.0" y="441" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">内存字节 255</text>
<text x="450.0" y="465" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">原单字节写入函数</text>
<rect x="615" y="413" width="210" height="70" rx="5" fill="white" stroke="#a66b27"/>
<text x="720.0" y="441" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">读回值 7</text>
<text x="720.0" y="465" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">getter 按描述符限幅</text>
