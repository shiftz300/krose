<text x="410.0" y="236" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">原指令生成步骤事件</text>
<text x="410.0" y="260" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Tone → 按键或固定音高 → 移调 → 扫弦分时 → Note On / Note Off</text>
<line x1="410" y1="295" x2="410" y2="320" stroke="#647784" stroke-width="1"/>
<line x1="410" y1="320" x2="406.5202757271102" y2="312.79642318117857" stroke="#647784" stroke-width="1"/>
