<text x="137.5" y="114" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">键区 / 力度区 / 直通</text>
<text x="137.5" y="134" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Sort 决定排序，Latch 保留集合</text>
<rect x="292" y="62" width="235" height="100" rx="5" fill="white" stroke="#265d82"/>
