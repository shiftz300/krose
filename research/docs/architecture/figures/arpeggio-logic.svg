<text x="682.5" y="114" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">八种步长：40～480</text>
<text x="682.5" y="134" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Swing 改变选定步骤的时间</text>
