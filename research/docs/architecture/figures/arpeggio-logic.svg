<text x="410.0" y="348" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">输出到分配层</text>
<text x="410.0" y="372" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">检查记录时间、音高、力度与开关；音源和 TG 音频尚未接入本组实验</text>
<text x="410" y="436" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">已核对 1280 个 Pattern 的 27486 个有效步骤</text>
<text x="410" y="466" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">连续执行含 8 个原厂例子、4 类独立顺序检查和 36 组扫弦检查</text>
