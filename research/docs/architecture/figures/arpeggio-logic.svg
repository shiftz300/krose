<text x="409.5" y="114" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">552 字节，64 个步骤</text>
<text x="409.5" y="134" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">每步：音高 / Gate / 力度 / Flam</text>
