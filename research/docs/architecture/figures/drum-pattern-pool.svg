<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><rect width="100%" height="100%" fill="white"/>
<text x="410" y="35" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">PPAT 鼓轨库怎样装入与整理</text>
<rect x="20" y="65" width="150" height="100" rx="5" fill="white" stroke="#265d82"/>
<text x="95.0" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">文件头</text>
<text x="95.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">KSB0 / 64 字节</text>
<rect x="190" y="65" width="235" height="100" rx="5" fill="white" stroke="#265d82"/>
<text x="307.5" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">目录</text>
<text x="307.5" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">999 项 × 32 字节</text>
<text x="307.5" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">名称 / 原字段 / 事件指针</text>
<rect x="445" y="65" width="355" height="100" rx="5" fill="white" stroke="#265d82"/>
<text x="622.5" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">事件池</text>
<text x="622.5" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">小节头 → 音符 → 下一小节 → 结束</text>
<text x="622.5" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">133880 个八字节记录</text>
<line x1="170" y1="115" x2="190" y2="115" stroke="#647784" stroke-width="1"/>
<line x1="190" y1="115" x2="182.7964231811786" y2="118.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="190" y1="115" x2="182.7964231811786" y2="111.52027572711016" stroke="#647784" stroke-width="1"/>
<line x1="425" y1="115" x2="445" y2="115" stroke="#647784" stroke-width="1"/>
<line x1="445" y1="115" x2="437.79642318117857" y2="118.47972427288984" stroke="#647784" stroke-width="1"/>
<line x1="445" y1="115" x2="437.79642318117857" y2="111.52027572711016" stroke="#647784" stroke-width="1"/>
<text x="410" y="206" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#237b78">装载：按新基址修正全部非空指针，保持事件内容。</text>
<rect x="20" y="240" width="235" height="95" rx="5" fill="white" stroke="#237b78"/>
<text x="137.5" y="268" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">替换目标 Pattern</text>
<text x="137.5" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">计算新旧长度之差</text>
<text x="137.5" y="312" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">允许替换为更长、较短或空内容</text>
<rect x="292" y="240" width="235" height="95" rx="5" fill="white" stroke="#237b78"/>
<text x="409.5" y="268" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">搬移后续事件</text>
<text x="409.5" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">原 memmove 处理重叠</text>
<text x="409.5" y="312" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">修正后续目录项的指针</text>
<rect x="565" y="240" width="235" height="95" rx="5" fill="white" stroke="#237b78"/>
<text x="682.5" y="268" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">清理尾部</text>
<text x="682.5" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">更新目标目录项</text>
<text x="682.5" y="312" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">清零已使用事件之后的空间</text>
<line x1="255" y1="287" x2="292" y2="287" stroke="#647784" stroke-width="1"/>
<line x1="292" y1="287" x2="284.79642318117857" y2="290.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="292" y1="287" x2="284.79642318117857" y2="283.5202757271102" stroke="#647784" stroke-width="1"/>
<line x1="527" y1="287" x2="565" y2="287" stroke="#647784" stroke-width="1"/>
<line x1="565" y1="287" x2="557.7964231811786" y2="290.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="565" y1="287" x2="557.7964231811786" y2="283.5202757271102" stroke="#647784" stroke-width="1"/>
<text x="410" y="382" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">已检查全部目录与 5517 个小节；24 次替换逐字节比较完整事件池。</text>
<text x="410" y="417" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#a66b27">图示为数据装载与编辑路径；鼓轨触发和实时播放继续追踪。</text>
</svg>