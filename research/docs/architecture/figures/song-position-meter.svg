<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="34" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="22" fill="#18354a">MIDI 定位按累计拍长计算，跨小节时读取新拍号</text>
<rect x="65" y="80" width="160" height="100" rx="5" fill="white" stroke="#265d82"/>
<text x="145.0" y="108" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">第 1 小节 · 4/4</text>
<text x="145.0" y="132" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">1920 tick</text>
<text x="145.0" y="152" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">16 个定位单位</text>
<rect x="225" y="80" width="140" height="100" rx="5" fill="white" stroke="#237b78"/>
<text x="295.0" y="108" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">第 2 小节 · 7/8</text>
<text x="295.0" y="132" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">1680 tick</text>
<text x="295.0" y="152" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">14 个定位单位</text>
<rect x="365" y="80" width="440" height="100" rx="5" fill="white" stroke="#a66b27"/>
<text x="585.0" y="108" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">第 3 小节 · 11/4</text>
<text x="585.0" y="132" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">5280 tick</text>
<text x="585.0" y="152" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">44 个定位单位</text>
<line x1="65" y1="183" x2="65" y2="201" stroke="#647784" stroke-width="1"/>
<text x="65" y="224" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">0</text>
<line x1="215" y1="183" x2="215" y2="201" stroke="#647784" stroke-width="1"/>
<line x1="225" y1="183" x2="225" y2="201" stroke="#647784" stroke-width="1"/>
<text x="225" y="224" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">16</text>
<line x1="355" y1="183" x2="355" y2="201" stroke="#647784" stroke-width="1"/>
<line x1="365" y1="183" x2="365" y2="201" stroke="#647784" stroke-width="1"/>
<text x="365" y="224" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">30</text>
<line x1="805" y1="183" x2="805" y2="201" stroke="#647784" stroke-width="1"/>
<text x="805" y="224" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">74</text>
<text x="450" y="264" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">位置 15 → 第 1 小节，tick 1800</text>
<text x="450" y="295" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#237b78">位置 16 → 第 2 小节，tick 0</text>
<text x="450" y="326" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#a66b27">位置 30 → 第 3 小节，tick 0</text>
<text x="450" y="363" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">一个定位单位 = 120 tick；小节编号在界面中从 1 开始。</text>
</svg>