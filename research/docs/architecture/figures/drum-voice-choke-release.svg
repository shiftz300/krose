<svg xmlns="http://www.w3.org/2000/svg" width="930" height="590" viewBox="0 0 930 590"><rect width="100%" height="100%" fill="white"/>
<text x="465" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">截音与松键是两条独立规则</text>
<text x="465" y="67" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">Basic Kit 1：按键 54、56、58 共用独占组 2；新音截断同组旧音</text>
<rect x="40" y="109" width="350" height="116" rx="5" fill="white" stroke="#265d82"/>
<text x="215.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">第一次起音：按键 54</text>
<text x="215.0" y="161" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">建立 1 个声部</text>
<text x="215.0" y="181" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">活动槽：0</text>
<text x="215.0" y="201" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">音符挂入 OSC 活动列表</text>
<rect x="540" y="109" width="350" height="116" rx="5" fill="white" stroke="#237b78"/>
<text x="715.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">第二次起音：按键 58</text>
<text x="715.0" y="161" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">硬停止旧槽：0</text>
<text x="715.0" y="181" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">存活槽：1</text>
<text x="715.0" y="201" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">若旧音为立体声，两侧一起停止</text>
<line x1="390" y1="167" x2="540" y2="167" stroke="#a66b27" stroke-width="1"/>
<line x1="540" y1="167" x2="532.7964231811786" y2="170.47972427288985" stroke="#a66b27" stroke-width="1"/>
<line x1="540" y1="167" x2="532.7964231811786" y2="163.52027572711015" stroke="#a66b27" stroke-width="1"/>
<text x="465" y="270" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">独占组 0 允许叠加；非零组在新音挂入列表前清理旧音。</text>
<rect x="40" y="327" width="400" height="119" rx="5" fill="white" stroke="#265d82"/>
<text x="240.0" y="355" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">多数鼓键：松键后继续衰减</text>
<text x="240.0" y="379" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Program Hold 开启，按键未启用 Note Off</text>
<text x="240.0" y="399" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">松键清除按下标志，保持原音量包络</text>
<text x="240.0" y="419" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">3583 个原厂分配键保存这一配置</text>
<rect x="490" y="327" width="400" height="119" rx="5" fill="white" stroke="#237b78"/>
<text x="690.0" y="355" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">Human Beat Box：部分键允许释音</text>
<text x="690.0" y="379" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">11 个分配键启用 Note Off 接收</text>
<text x="690.0" y="399" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">松键进入原释放分支并提交控制</text>
<text x="690.0" y="419" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">释放允许位已逐个启动上下文核对</text>
<text x="465" y="506" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">连续截音：271 组；松键代表上下文：43 组。</text>
<text x="465" y="549" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">图示为原控制与命令结果；样本尾音和硬件衰减时长尚未作为音频比较。</text>
</svg>