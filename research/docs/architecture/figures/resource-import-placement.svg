<text x="590" y="760" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">校验错误或末记录读失败：函数返回 0 并恢复流位置，此前的目标写入保留。</text>
<text x="590" y="799" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#237b78">插件应先校验分节及目标容量，再提交记录与引用；成功标志不能替代写入计数。</text>
<text x="590" y="837" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">结论限于原分节与引用内核；外层安装器预检、错误恢复、旧格式和音频未在此执行。</text>
