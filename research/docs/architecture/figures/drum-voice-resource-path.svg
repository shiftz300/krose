<text x="465.0" y="343" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">两项有符号修正共同决定中间增益</text>
<text x="465.0" y="367" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">交叉缩放后的层电平：127</text>
<text x="465.0" y="387" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">鼓组描述符修正 -10，鼓采样目录修正 -66</text>
<text x="465.0" y="407" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">原整数结果 G = 9817；后续仍叠加力度、调制与包络</text>
<text x="465.0" y="427" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">采样根音固定为 60，调音来自每层的粗调与微调</text>
<text x="465" y="502" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">鼓组层电平与旋律音色的处理方式不同，不能共用旋律描述符的缩放规则。</text>
<text x="465" y="546" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">模式、起始、结束和循环命令已与原样本字节逐项核对；本轮未渲染音频。</text>
