<svg xmlns="http://www.w3.org/2000/svg" width="930" height="590" viewBox="0 0 930 590"><rect width="100%" height="100%" fill="white"/>
<text x="465" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">鼓组怎样找到真正播放的采样</text>
<text x="465" y="67" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">原厂 F033 / Rock Kit 1，按键 24、力度 100；整条原 ARM 控制链执行</text>
<rect x="25" y="103" width="260" height="112" rx="5" fill="white" stroke="#265d82"/>
<text x="155.0" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">Program → Drum Kit</text>
<text x="155.0" y="155" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">OSC 选择鼓组 2</text>
<text x="155.0" y="175" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">128 个按键，各占 68 字节</text>
<text x="155.0" y="195" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">空键向上寻找下一分配键</text>
<rect x="335" y="103" width="260" height="112" rx="5" fill="white" stroke="#265d82"/>
<text x="465.0" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">按键 → 力度层</text>
<text x="465.0" y="155" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按键 24，第 1 层</text>
<text x="465.0" y="175" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">四个候选层，最多同时取两层</text>
<text x="465.0" y="195" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">当前权重 32768 / 32768</text>
<rect x="645" y="103" width="260" height="112" rx="5" fill="white" stroke="#237b78"/>
<text x="775.0" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">鼓采样目录 → PCM</text>
<text x="775.0" y="155" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Drumsample 33</text>
<text x="775.0" y="175" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Sample 3269</text>
<text x="775.0" y="195" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">左右配对来自原生目录构造</text>
