<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"><rect width="100%" height="100%" fill="white"/>
<text x="380" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">一个音符怎样进入音源</text>
