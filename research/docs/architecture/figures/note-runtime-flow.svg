<text x="635.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">力度层选择</text>
<text x="635.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">四个候选层，最多取两个</text>
<text x="635.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">计算交叉淡化权重</text>
<rect x="275" y="220" width="210" height="105" rx="5" fill="white" stroke="#265d82"/>
<text x="380.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">声部分配</text>
<text x="380.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">每层占 1 或 2 个槽</text>
<text x="380.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">强制分配 / 候选替换</text>
<rect x="20" y="220" width="210" height="105" rx="5" fill="white" stroke="#265d82"/>
<text x="125.0" y="248" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">立体声配对</text>
<text x="125.0" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按 TG 槽号排序</text>
<text x="125.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">记录双方指针与配对类型</text>
<rect x="20" y="375" width="210" height="105" rx="5" fill="white" stroke="#265d82"/>
<text x="125.0" y="403" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">延迟启动</text>
<text x="125.0" y="427" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">剩余时间 / 访问次数</text>
<text x="125.0" y="447" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">到期后设置就绪标志</text>
