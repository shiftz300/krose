<text x="635.0" y="427" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">采样 / 滤波 / 效果</text>
<text x="635.0" y="447" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">DSP 指令语义仍待恢复</text>
