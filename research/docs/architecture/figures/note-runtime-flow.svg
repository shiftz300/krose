<text x="380.0" y="427" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">参数初始化与寄存器写入</text>
<text x="380.0" y="447" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">本次在函数边界截获</text>
