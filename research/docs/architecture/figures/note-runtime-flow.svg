<text x="380.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">16 通道 / 音色开关</text>
<text x="380.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">键区与力度区筛选</text>
<rect x="530" y="65" width="210" height="105" rx="5" fill="white" stroke="#265d82"/>
<text x="635.0" y="93" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">PCM 振荡器</text>
<text x="635.0" y="117" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">虚表 +0x14 调用</text>
<text x="635.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">选择参与发声的 OSC</text>
