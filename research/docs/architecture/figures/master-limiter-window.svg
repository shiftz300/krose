<text x="920" y="434" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">单位阶跃 / 帧序号；此曲线未执行原 TG 指令。</text>
<text x="600" y="507" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="20" fill="#265d82">原初始化：两组端点差为 24，闭区间各含 25 个地址单元</text>
<rect x="100" y="548" width="480" height="118" rx="5" fill="white" stroke="#237b78"/>
<text x="340.0" y="576" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">常数 30 → 32</text>
<text x="340.0" y="600" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">base → base + 24</text>
<text x="340.0" y="620" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">25 个地址单元</text>
<rect x="620" y="548" width="480" height="118" rx="5" fill="white" stroke="#265d82"/>
<text x="860.0" y="576" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">常数 31 → 33</text>
<text x="860.0" y="600" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">base + 25 → base + 49</text>
<text x="860.0" y="620" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">25 个地址单元</text>
<text x="600" y="722" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#237b78">25 项常数在 564 次原厂参数回调后保持原值；参数更新集中于阈值、上限、释放和干湿。</text>
<text x="600" y="767" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">两个 MFX 槽位另外把程序项 108 / 110 / 112 / 113 的 C 字段改为 14；其算术含义尚未确定。</text>
<text x="600" y="815" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#a66b27">FIR 候选的群延迟为 12 帧。这是主机卷积的性质，琴的端到端延迟仍缺证据。</text>
<text x="600" y="858" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">尚未确定：窗口用于检测、增益或音频的哪个环节；地址单位、读写顺序和 DSP 舍入。</text>
