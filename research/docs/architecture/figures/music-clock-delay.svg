<text x="450.0" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">共享音乐计数</text>
<text x="450.0" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">每个内部 tick 加一</text>
<text x="450.0" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">32 位计数允许回绕</text>
