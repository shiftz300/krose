<text x="135.0" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">内部节拍发生器</text>
<text x="135.0" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">64 位周期与余量</text>
<text x="135.0" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">变速在节拍边界生效</text>
