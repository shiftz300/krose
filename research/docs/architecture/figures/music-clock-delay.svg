<text x="765.0" y="98" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">音源管理器</text>
<text x="765.0" y="122" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">读取本次 tick 差值</text>
<text x="765.0" y="142" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">通过原虚表调用 PCM 管理器</text>
