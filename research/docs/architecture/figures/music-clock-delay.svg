<text x="765.0" y="268" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">等待队列</text>
<text x="765.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">先扣节拍，再扣固定等待</text>
<text x="765.0" y="312" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">全部到期：设置就绪 bit 3</text>
