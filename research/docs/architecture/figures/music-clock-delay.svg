<text x="450.0" y="292" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">读取就绪标志</text>
<text x="450.0" y="312" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">更新音高并提交 TG 启动</text>
