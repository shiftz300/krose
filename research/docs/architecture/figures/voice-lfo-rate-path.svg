<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="36" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">两组频率调制共同推进 LFO 状态</text>
<rect x="30" y="85" width="350" height="95" rx="5" fill="white" stroke="#265d82"/>
<text x="205.0" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">第一组频率 AMS</text>
<text x="205.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Amount + (Amount AMS × 来源 &gt;&gt; 12)</text>
<text x="205.0" y="157" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">再乘 AMS1 来源</text>
<rect x="520" y="85" width="350" height="95" rx="5" fill="white" stroke="#237b78"/>
<text x="695.0" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">第二组频率 AMS</text>
<text x="695.0" y="137" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">Amount2 × AMS2 来源</text>
<rect x="80" y="230" width="250" height="95" rx="5" fill="white" stroke="#265d82"/>
<text x="205.0" y="258" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">整数调制与原表</text>
<text x="205.0" y="282" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">限幅 → 查表</text>
<text x="205.0" y="302" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">输出 F1；默认 256</text>
<rect x="570" y="230" width="250" height="95" rx="5" fill="white" stroke="#237b78"/>
<text x="695.0" y="258" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">整数调制与原表</text>
<text x="695.0" y="282" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">限幅 → 查表</text>
<text x="695.0" y="302" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">输出 F2；默认 256</text>
<line x1="205" y1="180" x2="205" y2="230" stroke="#265d82" stroke-width="1"/>
<line x1="205" y1="230" x2="201.52027572711015" y2="222.7964231811786" stroke="#265d82" stroke-width="1"/>
<line x1="205" y1="230" x2="208.47972427288985" y2="222.7964231811786" stroke="#265d82" stroke-width="1"/>
<line x1="695" y1="180" x2="695" y2="230" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="230" x2="691.5202757271102" y2="222.7964231811786" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="230" x2="698.4797242728898" y2="222.7964231811786" stroke="#237b78" stroke-width="1"/>
<rect x="250" y="385" width="400" height="95" rx="5" fill="white" stroke="#265d82"/>
<text x="450.0" y="413" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">合并更新尺度</text>
<text x="450.0" y="437" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">scale = min((F1 × F2) &gt;&gt; 8, 2147483647)</text>
<line x1="205" y1="325" x2="205" y2="360" stroke="#265d82" stroke-width="1"/>
<line x1="205" y1="360" x2="365" y2="360" stroke="#265d82" stroke-width="1"/>
<line x1="365" y1="360" x2="365" y2="385" stroke="#265d82" stroke-width="1"/>
<line x1="365" y1="385" x2="361.5202757271102" y2="377.79642318117857" stroke="#265d82" stroke-width="1"/>
<line x1="365" y1="385" x2="368.4797242728898" y2="377.79642318117857" stroke="#265d82" stroke-width="1"/>
<line x1="695" y1="325" x2="695" y2="360" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="360" x2="535" y2="360" stroke="#237b78" stroke-width="1"/>
<line x1="535" y1="360" x2="535" y2="385" stroke="#237b78" stroke-width="1"/>
<line x1="535" y1="385" x2="531.5202757271102" y2="377.79642318117857" stroke="#237b78" stroke-width="1"/>
<line x1="535" y1="385" x2="538.4797242728898" y2="377.79642318117857" stroke="#237b78" stroke-width="1"/>
<rect x="30" y="535" width="350" height="85" rx="5" fill="white" stroke="#a66b27"/>
<text x="205.0" y="563" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">Delay / Fade</text>
<text x="205.0" y="587" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">同一 scale 改变等待与淡入速度</text>
<rect x="520" y="535" width="350" height="85" rx="5" fill="white" stroke="#237b78"/>
<text x="695.0" y="563" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">相位推进</text>
<text x="695.0" y="587" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">自由频率或音乐时钟；可单独暂停</text>
<line x1="350" y1="480" x2="350" y2="505" stroke="#a66b27" stroke-width="1"/>
<line x1="350" y1="505" x2="205" y2="505" stroke="#a66b27" stroke-width="1"/>
<line x1="205" y1="505" x2="205" y2="535" stroke="#a66b27" stroke-width="1"/>
<line x1="205" y1="535" x2="201.52027572711015" y2="527.7964231811786" stroke="#a66b27" stroke-width="1"/>
<line x1="205" y1="535" x2="208.47972427288985" y2="527.7964231811786" stroke="#a66b27" stroke-width="1"/>
<line x1="550" y1="480" x2="550" y2="505" stroke="#237b78" stroke-width="1"/>
<line x1="550" y1="505" x2="695" y2="505" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="505" x2="695" y2="535" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="535" x2="691.5202757271102" y2="527.7964231811786" stroke="#237b78" stroke-width="1"/>
<line x1="695" y1="535" x2="698.4797242728898" y2="527.7964231811786" stroke="#237b78" stroke-width="1"/>
<text x="450" y="664" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">状态推进和波形求值都按 LFO2 → LFO1；交叉调制保留此顺序。</text>
<text x="450" y="690" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">图示为原声部 LFO 子链；完整声部调度与音频输出另行连接。</text>
</svg>