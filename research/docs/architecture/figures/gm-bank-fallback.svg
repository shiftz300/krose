<svg xmlns="http://www.w3.org/2000/svg" width="950" height="550" viewBox="0 0 950 550"><rect width="100%" height="100%" fill="white"/>
<text x="475" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">十一组逻辑 GM 银行，共用三份参数文件</text>
<text x="475" y="66" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">128 个基本音色 + 128 个实际变体 + 9 个鼓组；缺少的变体回退到基本音色</text>
<rect x="25" y="111" width="260" height="138" rx="5" fill="white" stroke="#265d82"/>
<text x="155.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">G：基本音色</text>
<text x="155.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">PROGGC.BIN</text>
<text x="155.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">逻辑银行 10 → 实体银行 10</text>
<text x="155.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">程序号直接作为文件内索引</text>
<text x="155.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">共 128 条，索引 0–127</text>
<rect x="345" y="111" width="260" height="138" rx="5" fill="white" stroke="#265d82"/>
<text x="475.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">g1–g9：变体</text>
<text x="475.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">PROGGV.BIN</text>
<text x="475.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">逻辑银行 11–19 → 实体银行 11</text>
<text x="475.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">用每个基本音色的起点与数量查表</text>
<text x="475.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">合计 128 条，数量最高为 9</text>
<rect x="665" y="111" width="260" height="138" rx="5" fill="white" stroke="#265d82"/>
<text x="795.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">gd：鼓组</text>
<text x="795.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">PROGGD.BIN</text>
<text x="795.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">逻辑银行 20 → 实体银行 12</text>
<text x="795.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">程序号按范围映射到九套鼓组</text>
<text x="795.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">64–127 回到 STANDARD</text>
<rect x="85" y="325" width="780" height="120" rx="5" fill="white" stroke="#a66b27"/>
<text x="475.0" y="353" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">例：请求钢琴的第三个变体 g3-001</text>
<text x="475.0" y="377" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">GM Acoustic Piano 只有两个变体，第三个请求缺少对应记录</text>
<text x="475.0" y="397" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">原映射改为 G001 → PROGGC.BIN 第 0 条；原返回值为 0</text>
<text x="475.0" y="417" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">插件应继续使用回退音色，避免把该返回值直接当作停止发声</text>
<text x="475" y="502" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">变体银行的 1152 种程序号组合中，128 种有记录，1024 种进入基本音色回退。</text>
</svg>