<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510"><rect width="100%" height="100%" fill="white"/>
<text x="520" y="36" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">换音前后的声部各自保留来源</text>
<text x="520" y="66" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">A000 双 OSC 钢琴 → A061 单 OSC Celesta；原 MIDI 连续流程，力度 127</text>
<text x="260" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">按键 48</text>
<line x1="260" y1="127" x2="260" y2="414" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="420" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#a66b27">换音</text>
<line x1="420" y1="127" x2="420" y2="414" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="580" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">按键 64</text>
<line x1="580" y1="127" x2="580" y2="414" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="740" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">松键 48</text>
<line x1="740" y1="127" x2="740" y2="414" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="900" y="113" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">松键 64</text>
<line x1="900" y1="127" x2="900" y2="414" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="115" y="164" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">声部 0 / OSC 1</text>
<text x="115" y="181" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="11" fill="#647784">A000 / Sample 1667</text>
<line x1="260" y1="164" x2="740" y2="164" stroke="#265d82" stroke-width="7"/>
<line x1="740" y1="153" x2="740" y2="175" stroke="#265d82" stroke-width="2"/>
<text x="115" y="212" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">声部 1 / OSC 1</text>
<text x="115" y="229" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="11" fill="#647784">A000 / Sample 1668</text>
<line x1="260" y1="212" x2="740" y2="212" stroke="#265d82" stroke-width="7"/>
<line x1="740" y1="201" x2="740" y2="223" stroke="#265d82" stroke-width="2"/>
<text x="115" y="260" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">声部 2 / OSC 2</text>
<text x="115" y="277" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="11" fill="#647784">A000 / Sample 3175</text>
<line x1="260" y1="260" x2="740" y2="260" stroke="#265d82" stroke-width="7"/>
<line x1="740" y1="249" x2="740" y2="271" stroke="#265d82" stroke-width="2"/>
<text x="115" y="308" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">声部 3 / OSC 2</text>
<text x="115" y="325" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="11" fill="#647784">A000 / Sample 3176</text>
<line x1="260" y1="308" x2="740" y2="308" stroke="#265d82" stroke-width="7"/>
<line x1="740" y1="297" x2="740" y2="319" stroke="#265d82" stroke-width="2"/>
<text x="115" y="356" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#237b78">声部 4 / OSC 1</text>
<text x="115" y="373" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="11" fill="#647784">A061 / Sample 447</text>
<line x1="580" y1="356" x2="900" y2="356" stroke="#237b78" stroke-width="7"/>
<line x1="900" y1="345" x2="900" y2="367" stroke="#237b78" stroke-width="2"/>
<text x="520" y="448" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">线段表示按键保持状态；竖线表示原关音处理，未按音频时长绘制。</text>
<text x="520" y="487" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#a66b27">旧 OSC2 退出新起音列表后，原关音入口仍会遍历它的旧声部。</text>
</svg>