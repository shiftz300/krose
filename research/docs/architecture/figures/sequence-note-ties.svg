<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="33" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="21" fill="#18354a">跨小节延音沿用原音符，零时长音符在下一次扫描关音</text>
<text x="450" y="69" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">原顺向调度器的连续执行轨迹 · 4/4，每小节 1920 tick</text>
<line x1="100" y1="300" x2="840" y2="300" stroke="#647784" stroke-width="1"/>
<line x1="100" y1="100" x2="100" y2="306" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="100" y="328" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">小节 0 / 1800</text>
<line x1="230" y1="100" x2="230" y2="306" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="230" y="328" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">1801</text>
<line x1="500" y1="100" x2="500" y2="306" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="500" y="328" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">小节 1 / 0</text>
<line x1="800" y1="100" x2="800" y2="306" stroke="#dce5eb" stroke-width="1" stroke-dasharray="5 4"/>
<text x="800" y="328" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">120</text>
<text x="50" y="153" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">C4</text>
<line x1="100" y1="150" x2="800" y2="150" stroke="#265d82" stroke-width="4"/>
<text x="175" y="123" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">Note On</text>
<text x="500" y="188" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">延音记录匹配音高与力度</text>
<text x="780" y="123" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">Note Off</text>
<text x="50" y="253" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">D4</text>
<line x1="100" y1="250" x2="230" y2="250" stroke="#237b78" stroke-width="4"/>
<text x="170" y="225" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#237b78">时长 0</text>
<text x="322" y="272" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#237b78">下一次扫描发送 Note Off</text>
<text x="450" y="378" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">C4：7FFF 延音 → 小节边界转为 7FFE → 续接记录写入结束 tick 120。</text>
<text x="450" y="411" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">横向间距为示意；小节与 tick 标注、消息顺序来自检查结果。</text>
</svg>