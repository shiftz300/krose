<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"><rect width="100%" height="100%" fill="white"/>
<text x="410" y="35" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">鼓轨循环、跨小节关音与停止</text>
<text x="410" y="63" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">合成单小节 Pattern；两圈逐 tick 执行；在 3839 停止</text>
<text x="45" y="127" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">36</text>
<line x1="100" y1="120" x2="750" y2="120" stroke="#647784" stroke-width="1"/>
<text x="45" y="187" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">38</text>
<line x1="100" y1="180" x2="750" y2="180" stroke="#647784" stroke-width="1"/>
<text x="45" y="247" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">42</text>
<line x1="100" y1="240" x2="750" y2="240" stroke="#647784" stroke-width="1"/>
<line x1="100.0" y1="120" x2="110.15625" y2="120" stroke="#237b78" stroke-width="5"/>
<line x1="120.3125" y1="180" x2="140.625" y2="180" stroke="#237b78" stroke-width="5"/>
<line x1="404.6875" y1="240" x2="425.0" y2="240" stroke="#237b78" stroke-width="5"/>
<line x1="425.16927083333337" y1="120" x2="435.15625" y2="120" stroke="#237b78" stroke-width="5"/>
<line x1="445.3125" y1="180" x2="465.625" y2="180" stroke="#237b78" stroke-width="5"/>
<line x1="729.6875" y1="240" x2="749.8307291666667" y2="240" stroke="#237b78" stroke-width="5"/>
<line x1="100.0" y1="90" x2="100.0" y2="263" stroke="#a66b27" stroke-width="1" stroke-dasharray="5 4"/>
<text x="100.0" y="289" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#a66b27">0</text>
<line x1="425.0" y1="90" x2="425.0" y2="263" stroke="#a66b27" stroke-width="1" stroke-dasharray="5 4"/>
<text x="425.0" y="289" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#a66b27">循环 1920</text>
<line x1="749.8307291666667" y1="90" x2="749.8307291666667" y2="263" stroke="#a66b27" stroke-width="1" stroke-dasharray="5 4"/>
<text x="749.8307291666667" y="289" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#a66b27">停止 3839</text>
<text x="410" y="336" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">音符 42 的时长超出小节，在边界关音；第二圈首音在 1921 起音。</text>
</svg>