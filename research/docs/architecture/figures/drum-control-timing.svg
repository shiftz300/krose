<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="100%" height="100%" fill="white"/>
<text x="480" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">参数写入后，何时影响鼓声</text>
<text x="480" y="67" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">原参数写入入口 → 原刷新管理器 → 原再次起音；F042 / Basic Kit 1，按键 48</text>
<rect x="25" y="111" width="270" height="138" rx="5" fill="white" stroke="#265d82"/>
<text x="160.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">起音时保存到声部</text>
<text x="160.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">粗调 / 微调</text>
<text x="160.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">滤波截止偏移 / 共振偏移</text>
<text x="160.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">本例原值：调音 0、偏移 0 / 0</text>
<text x="160.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">后续刷新沿用已保存的状态</text>
<rect x="345" y="111" width="270" height="138" rx="5" fill="white" stroke="#a66b27"/>
<text x="480.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">修改逐键记录</text>
<text x="480.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">调音 76 / 48；滤波 96 / 80</text>
<text x="480.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">已有声部连续推进 32 次</text>
<text x="480.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">全部声部字节与基线相同</text>
<text x="480.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">TG 读写顺序与值也相同</text>
<rect x="665" y="111" width="270" height="138" rx="5" fill="white" stroke="#237b78"/>
<text x="800.0" y="139" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">再次起音读取新值</text>
<text x="800.0" y="163" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">新调音量：2368</text>
<text x="800.0" y="183" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">新截止偏移：8320</text>
<text x="800.0" y="203" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">新共振偏移：16</text>
<text x="800.0" y="223" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">新声部独立核对原整数方程</text>
<line x1="295" y1="180" x2="345" y2="180" stroke="#647784" stroke-width="1"/>
<line x1="345" y1="180" x2="337.79642318117857" y2="183.47972427288985" stroke="#647784" stroke-width="1"/>
<line x1="345" y1="180" x2="337.79642318117857" y2="176.52027572711015" stroke="#647784" stroke-width="1"/>
<line x1="615" y1="180" x2="665" y2="180" stroke="#647784" stroke-width="1"/>
<line x1="665" y1="180" x2="657.7964231811786" y2="183.47972427288985" stroke="#647784" stroke-width="1"/>
<line x1="665" y1="180" x2="657.7964231811786" y2="176.52027572711015" stroke="#647784" stroke-width="1"/>
<rect x="120" y="322" width="720" height="132" rx="5" fill="white" stroke="#265d82"/>
<text x="480.0" y="350" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">音量、声像与发送在持续刷新中读取</text>
<text x="480.0" y="374" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">逐键声像改为 96 后，本例下一次处理得到目标 24576</text>
<text x="480.0" y="394" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">发送同时受逐键覆盖、通道缩放和路由抑制约束</text>
<text x="480.0" y="414" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">随机声像沿用该声部起音时生成的位置；重复刷新保持该位置</text>
<text x="480.0" y="434" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">这条路径的变化无需等待下一次起音</text>
<text x="480" y="509" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">结论适用于本轮逐键写入与正常刷新路径；其他编辑回调的副作用单独保留。</text>
<text x="480" y="555" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">控制更新次数尚未换算为硬件时间；当前检查未生成声音。</text>
</svg>