<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660"><rect width="100%" height="100%" fill="white"/>
<text x="520" y="36" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">CC123 与 CC120：释音和硬停的区别</text>
<text x="520" y="66" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">A000 → A061 / 模式 3 / 两踏板开启；原关音调用返回时的声部数</text>
<rect x="45" y="108" width="440" height="190" rx="5" fill="white" stroke="#265d82"/>
<text x="265.0" y="136" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">CC123 / All Notes Off</text>
<text x="265.0" y="160" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">调用前：5 个声部</text>
<text x="265.0" y="180" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">调用后仍分配：5 个</text>
<text x="265.0" y="200" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">释放请求：1；硬停回收：0</text>
<text x="265.0" y="220" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">空闲槽：27 / 32</text>
<rect x="555" y="108" width="440" height="190" rx="5" fill="white" stroke="#237b78"/>
<text x="775.0" y="136" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">CC120 / All Sound Off</text>
<text x="775.0" y="160" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">调用前：5 个声部</text>
<text x="775.0" y="180" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">调用后仍分配：0 个</text>
<text x="775.0" y="200" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">释放请求：0；硬停回收：5</text>
<text x="775.0" y="220" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">空闲槽：32 / 32</text>
<text x="520" y="344" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">两条命令都保留控制器；CC123 继续遵守踏板和鼓键释放规则。</text>
<text x="520" y="400" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="20" fill="#a66b27">后续复用仍有失败证据</text>
<rect x="45" y="431" width="260" height="92" rx="5" fill="white" stroke="#a66b27"/>
<text x="175.0" y="459" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">硬停回收</text>
<text x="175.0" y="483" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">成对声部移出活动列表</text>
<rect x="390" y="431" width="260" height="92" rx="5" fill="white" stroke="#a66b27"/>
<text x="520.0" y="459" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">重新申请声部</text>
<text x="520.0" y="483" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">旧配对引用仍在</text>
<rect x="735" y="431" width="260" height="92" rx="5" fill="white" stroke="#a66b27"/>
<text x="865.0" y="459" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">移除伙伴节点</text>
<text x="865.0" y="483" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">节点已清空，访问地址 0x4</text>
<line x1="305" y1="478" x2="390" y2="478" stroke="#a66b27" stroke-width="1"/>
<line x1="390" y1="478" x2="382.79642318117857" y2="481.4797242728898" stroke="#a66b27" stroke-width="1"/>
<line x1="390" y1="478" x2="382.79642318117857" y2="474.5202757271102" stroke="#a66b27" stroke-width="1"/>
<line x1="650" y1="478" x2="735" y2="478" stroke="#a66b27" stroke-width="1"/>
<line x1="735" y1="478" x2="727.7964231811786" y2="481.4797242728898" stroke="#a66b27" stroke-width="1"/>
<line x1="735" y1="478" x2="727.7964231811786" y2="474.5202757271102" stroke="#a66b27" stroke-width="1"/>
<text x="520" y="578" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#a66b27">原 MIDI 调度与显式原函数调度均复现；尚不能据此认定实机故障。</text>
<text x="520" y="622" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">已核对关音规则；停止后的完整连续演奏未通过。本图没有绘制 DSP 音频。</text>
</svg>