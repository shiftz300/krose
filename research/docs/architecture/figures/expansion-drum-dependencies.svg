<rect x="100" y="455" width="760" height="82" rx="5" fill="white" stroke="#a66b27"/>
<text x="480.0" y="483" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">45 条本库鼓采样目录已恢复，另有跨库缺口</text>
<text x="480.0" y="507" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">未提供银行涉及 10 条启用层，其中 9 条能被非零力度选中</text>
<text x="480.0" y="527" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">其余一条被原门槛遮住；这些引用单独保留，不纳入已具备资源的音色覆盖</text>
<text x="480" y="582" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">上述银行号为层描述符的编码值；银行 12 对应逻辑银行 6，当前资料没有该来源。</text>
