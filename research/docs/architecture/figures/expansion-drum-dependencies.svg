<text x="625" y="257" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#237b78">9</text>
<text x="835" y="257" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#a66b27">5</text>
