<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="100%" height="100%" fill="white"/>
<text x="480" y="37" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">四套 Future Synth 鼓组的采样依赖</text>
<text x="480" y="67" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">按启用层统计；同一个键可含多层，立体声层仍按一个描述符计数</text>
<text x="160" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">鼓组</text>
<text x="410" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#265d82">板载银行 0 / 1</text>
<text x="625" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#237b78">Future Synth 银行 10</text>
<text x="835" y="131" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="15" fill="#a66b27">未提供银行 12</text>
<text x="160" y="191" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">NU Pop Kit</text>
<text x="410" y="193" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#265d82">89</text>
<text x="625" y="193" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#237b78">12</text>
<text x="835" y="193" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#a66b27">5</text>
