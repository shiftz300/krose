<text x="685.0" y="283" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">原消息改成回复</text>
<text x="685.0" y="307" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">类型 8 / 子类型 0 / 命令 13</text>
<text x="685.0" y="327" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">流水号和载荷指针保持不变</text>
