<text x="215.0" y="457" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">释放载荷，归还消息节点</text>
<text x="215.0" y="477" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">原列表随后可清理</text>
<rect x="505" y="405" width="360" height="90" rx="5" fill="white" stroke="#a66b27"/>
<text x="685.0" y="433" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">后续页面处理</text>
<text x="685.0" y="457" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">使用 MMI 自己的记录副本</text>
<text x="685.0" y="477" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">回调与显示更新继续追踪</text>
