<line x1="505" y1="150" x2="497.79642318117857" y2="153.47972427288985" stroke="#647784" stroke-width="1"/>
<line x1="505" y1="150" x2="497.79642318117857" y2="146.52027572711015" stroke="#647784" stroke-width="1"/>
<rect x="35" y="255" width="360" height="90" rx="5" fill="white" stroke="#265d82"/>
<text x="215.0" y="283" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">等待命令 13</text>
<text x="215.0" y="307" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按子类型 / 命令 / 流水号匹配</text>
