<text x="685.0" y="133" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">复制每条记录</text>
<text x="685.0" y="157" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">24 字节独立副本</text>
<text x="685.0" y="177" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">追加到 MMI 待处理列表</text>
