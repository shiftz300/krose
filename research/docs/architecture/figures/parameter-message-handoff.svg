<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545"><rect width="100%" height="100%" fill="white"/>
<text x="450" y="38" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="23" fill="#18354a">MMI 复制参数列表后，发送方才回收消息</text>
<text x="215" y="84" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#265d82">任务 2 · CS / 参数发送方</text>
<text x="685" y="84" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="18" fill="#237b78">任务 3 · MMI 接收方</text>
<rect x="35" y="105" width="360" height="90" rx="5" fill="white" stroke="#265d82"/>
<text x="215.0" y="133" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">发送变更列表</text>
<text x="215.0" y="157" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">类型 9 / 子类型 0 / 命令 12</text>
<text x="215.0" y="177" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">附带 16 位流水号和列表指针</text>
