<text x="260" y="130" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#265d82">系数 K[D]（对数坐标）</text>
<text x="260" y="458" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#647784">D = min(所选标记, 24)</text>
<rect x="500" y="95" width="410" height="94" rx="5" fill="white" stroke="#237b78"/>
<text x="705.0" y="123" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">音量</text>
<text x="705.0" y="147" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">LFO 变化位 0x08：D = 1</text>
<text x="705.0" y="167" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">其他情况：D = 24</text>
<rect x="500" y="212" width="410" height="94" rx="5" fill="white" stroke="#237b78"/>
<text x="705.0" y="240" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">音高</text>
<text x="705.0" y="264" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">LFO 变化位 0x01：D = 0</text>
<text x="705.0" y="284" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">否则 EG 位 0x10 取时间标记；其余取 24</text>
<rect x="500" y="329" width="410" height="94" rx="5" fill="white" stroke="#237b78"/>
<text x="705.0" y="357" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">Filter A / B</text>
<text x="705.0" y="381" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">各自的 LFO 变化位：D = 1</text>
<text x="705.0" y="401" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">否则各自的 EG 位取时间标记；其余取 24</text>
<text x="470" y="496" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="13" fill="#265d82">K[0] = 65535，K[1] = 2047，K[24] = 85；实际步长还取决于目标差值。</text>
<text x="470" y="532" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">所有低七位标志组合、五种标记和三种差值方向另有直接提交检查。</text>
