<line x1="825" y1="164" x2="817.7964231811786" y2="167.47972427288985" stroke="#647784" stroke-width="1"/>
<line x1="825" y1="164" x2="817.7964231811786" y2="160.52027572711015" stroke="#647784" stroke-width="1"/>
<text x="305" y="282" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#265d82">99:22 → 98:48 → 6:70</text>
<line x1="555" y1="277" x2="625" y2="277" stroke="#265d82" stroke-width="1"/>
<line x1="625" y1="277" x2="617.7964231811786" y2="280.4797242728898" stroke="#265d82" stroke-width="1"/>
<line x1="625" y1="277" x2="617.7964231811786" y2="273.5202757271102" stroke="#265d82" stroke-width="1"/>
<text x="890" y="281" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">键 48 / Attack = 70</text>
<text x="305" y="341" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#237b78">99:23 → 6:41</text>
<line x1="555" y1="336" x2="625" y2="336" stroke="#237b78" stroke-width="1"/>
<line x1="625" y1="336" x2="617.7964231811786" y2="339.4797242728898" stroke="#237b78" stroke-width="1"/>
<line x1="625" y1="336" x2="617.7964231811786" y2="332.5202757271102" stroke="#237b78" stroke-width="1"/>
<text x="890" y="340" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">键 48 / Decay = 41（沿用键号）</text>
<text x="305" y="400" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#237b78">98:49 → 6:42</text>
<line x1="555" y1="395" x2="625" y2="395" stroke="#237b78" stroke-width="1"/>
<line x1="625" y1="395" x2="617.7964231811786" y2="398.4797242728898" stroke="#237b78" stroke-width="1"/>
<line x1="625" y1="395" x2="617.7964231811786" y2="391.5202757271102" stroke="#237b78" stroke-width="1"/>
<text x="890" y="399" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">键 49 / Decay = 42（沿用参数号）</text>
<text x="305" y="459" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#647784">101:127 → 100:127 → 6:99</text>
<line x1="555" y1="454" x2="625" y2="454" stroke="#647784" stroke-width="1"/>
<line x1="625" y1="454" x2="617.7964231811786" y2="457.4797242728898" stroke="#647784" stroke-width="1"/>
<line x1="625" y1="454" x2="617.7964231811786" y2="450.5202757271102" stroke="#647784" stroke-width="1"/>
<text x="890" y="458" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#647784">Null RPN：逐键记录保持原值</text>
<text x="305" y="518" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="17" fill="#a66b27">99:22 → 6:43</text>
<line x1="555" y1="513" x2="625" y2="513" stroke="#a66b27" stroke-width="1"/>
<line x1="625" y1="513" x2="617.7964231811786" y2="516.4797242728898" stroke="#a66b27" stroke-width="1"/>
<line x1="625" y1="513" x2="617.7964231811786" y2="509.5202757271102" stroke="#a66b27" stroke-width="1"/>
<text x="890" y="517" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#a66b27">键 49 / Attack = 43（切回后仍沿用键号）</text>
<text x="600" y="603" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#a66b27">上表来自原分发入口的连续事件；不能在每次选择后自动清空另一半状态。</text>
<rect x="65" y="637" width="495" height="102" rx="5" fill="white" stroke="#237b78"/>
<text x="312.5" y="665" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">消息来源 5</text>
<text x="312.5" y="689" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">活动控制与逐键参数照常更新</text>
<text x="312.5" y="709" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">通道影子值保持原值</text>
<rect x="640" y="637" width="495" height="102" rx="5" fill="white" stroke="#265d82"/>
<text x="887.5" y="665" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">受测连续包络</text>
<text x="887.5" y="689" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">来源 0 / 5 的六组配对结果一致</text>
<text x="887.5" y="709" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">保留当前段，后续阶段读取新值</text>
<text x="600" y="789" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">1544 条边界消息 · 12 条演奏轨迹 · 12288 次正常更新；未执行 TG 音频。</text>
</svg>