<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><rect width="100%" height="100%" fill="white"/>
<text x="600" y="40" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="24" fill="#18354a">NRPN 到鼓组包络：选择状态会保留</text>
<text x="600" y="71" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="14" fill="#647784">原 MIDI 控制器事件 → 通道 7 → 逐键记录 → 正常包络推进；串口字节收发不在此范围。</text>
<rect x="65" y="110" width="310" height="108" rx="5" fill="white" stroke="#265d82"/>
<text x="220.0" y="138" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">CC99：参数高字节</text>
<text x="220.0" y="162" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">22 = Attack / 23 = Decay</text>
<text x="220.0" y="182" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">只改变高字节时，旧键号可继续使用</text>
<rect x="445" y="110" width="310" height="108" rx="5" fill="white" stroke="#237b78"/>
<text x="600.0" y="138" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#237b78">CC98：鼓键低字节</text>
<text x="600.0" y="162" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">0–127，选择目标鼓键</text>
<text x="600.0" y="182" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">只改变键号时，旧参数号仍有效</text>
<rect x="825" y="110" width="310" height="108" rx="5" fill="white" stroke="#265d82"/>
<text x="980.0" y="138" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="16" fill="#265d82">CC6：参数值</text>
<text x="980.0" y="162" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">按当前选择状态解释</text>
<text x="980.0" y="182" text-anchor="middle" font-family="Heiti SC, sans-serif" font-size="12" fill="#647784">逐键写入，留给阶段入口读取</text>
<line x1="375" y1="164" x2="445" y2="164" stroke="#647784" stroke-width="1"/>
<line x1="445" y1="164" x2="437.79642318117857" y2="167.47972427288985" stroke="#647784" stroke-width="1"/>
<line x1="445" y1="164" x2="437.79642318117857" y2="160.52027572711015" stroke="#647784" stroke-width="1"/>
