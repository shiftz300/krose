name: Build installers and release
on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
    paths: ['src/**', 'cmake/**', 'tests/**', 'assets/**', 'packaging/**', 'controllers/**', 'tools/**', 'CMakeLists.txt', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    if: vars.KROSE_RELEASE_ASSETS_READY == 'true' || startsWith(github.ref, 'refs/tags/v')
    # GitHub draft releases are visible only to identities with push access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            arch: arm64
          - os: macos-15-intel
            platform: macos-x86_64
            arch: x86_64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure Visual Studio x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/windows_toolchain.ps1
      - name: Select Windows LLVM tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = 'C:/Program Files/LLVM/bin'
          foreach ($tool in 'clang-cl.exe', 'lld-link.exe', 'llvm-profdata.exe') {
            if (!(Test-Path "$llvm/$tool")) { throw "Missing LLVM tool: $tool" }
          }
          $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check release version
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'project\(Krose VERSION ([0-9.]+)',Path('CMakeLists.txt').read_text())[1]
          assert '#define PLUG_VERSION_STR "'+version+'"' in Path('src/plugin/config.h').read_text()
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag and product version must match'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('KROSE_VERSION='+version+'\n')
          PY
      - name: Tooling regressions
        run: python -B -m unittest discover -s tests/tools
      - name: Read runtime asset lock
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          lock=json.loads(Path('packaging/runtime-assets.json').read_text())
          assert re.fullmatch(r'runtime-assets-v[0-9]+',lock['tag'])
          assert re.fullmatch(r'[A-Za-z0-9._-]+',lock['file'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('KROSE_ASSET_TAG='+lock['tag']+'\n')
              f.write('KROSE_ASSET_FILE='+lock['file']+'\n')
          PY
      - uses: actions/cache@v6
        id: pcm
        with:
          path: |
            assets/concert-se-grand/SEGrand.samples
            assets/program-library/Factory.samples
          key: runtime-${{ hashFiles('packaging/runtime-assets.json') }}
      - name: Download verified runtime banks
        if: steps.pcm.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p build/downloads
          gh release download "$KROSE_ASSET_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$KROSE_ASSET_FILE" --dir build/downloads
          python tools/release/runtime_assets.py extract "build/downloads/$KROSE_ASSET_FILE"
      - name: Fetch pinned dependencies
        run: python tools/bootstrap_plugin.py
      - name: Configure native macOS Release with PGO
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DKROSE_ENABLE_IPO=ON -DKROSE_ENABLE_PGO=ON -DSEGRAND_BUILD_TOOLS=OFF -DBUILD_TESTING=ON
      - name: Configure Windows x64 Release
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_LINKER=lld-link
          -DKROSE_ENABLE_IPO=ON -DKROSE_ENABLE_PGO=ON -DSEGRAND_BUILD_TOOLS=OFF -DBUILD_TESTING=ON
      - name: Build optimized plugin and standalone
        run: cmake --build build/release --config Release --parallel 3
      - name: Engine and available host regressions
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Verify built-in controller resources
        run: python tools/build_controller_resources.py --verify-output build/release/out
      - name: Preserve native macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lipo build/release/out/Krose.app/Contents/MacOS/Krose -verify_arch "${{ matrix.arch }}"
          lipo build/release/out/Krose.vst3/Contents/MacOS/Krose -verify_arch "${{ matrix.arch }}"
          tar -cf "build/native-${{ matrix.arch }}.tar" -C build/release/out Krose.app Krose.vst3
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: Krose-native-${{ matrix.arch }}
          path: build/native-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 3
      - name: Package and smoke test Windows standalone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Provide a software OpenGL 2+ context on the hosted runner.
          $mesa = Join-Path $env:RUNNER_TEMP 'krose-mesa'
          New-Item -ItemType Directory -Force $mesa | Out-Null
          $archive = Join-Path $mesa 'mesa.7z'
          curl.exe --fail --location --retry 3 --output $archive https://github.com/pal1000/mesa-dist-win/releases/download/25.3.3/mesa3d-25.3.3-release-msvc.7z
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download software OpenGL for smoke test' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '66b79057ba273c08daa03551a231995d48b8623bb1efa9f3a7c3e09792d8f1ba') { throw 'Mesa archive checksum mismatch' }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y "-o$mesa" $archive 'x64\*.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract software OpenGL for smoke test' }
          $started = Get-Date
          python tools/release/package_standalone.py --input build/release/out --version $env:KROSE_VERSION --platform windows-x64 --output dist --smoke --windows-gl-dir "$mesa/x64"
          if ($LASTEXITCODE -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; ID=1000; StartTime=$started} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like '*Krose.exe*' } | Select-Object -First 1 -ExpandProperty Message
            throw 'Windows standalone smoke test failed'
          }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: Krose-windows-x64-standalone
          path: dist/*-portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Package Windows Inno installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/release/package_windows.ps1 -InputDirectory build/release/out -Version $env:KROSE_VERSION -OutputDirectory dist
      - name: Smoke test Windows install, migration and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/test_windows_installer.ps1 -Installer "dist/Krose-$env:KROSE_VERSION-windows-x64-setup.exe" -Version $env:KROSE_VERSION
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: Krose-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.pkg
          if-no-files-found: error
          retention-days: 14
  macos-universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: Krose-native-*
          path: build/native
          merge-multiple: true
      - name: Merge trained slices and package Universal installer
        shell: bash
        run: |
          mkdir -p build/arm64/out build/x86_64/out
          tar -xf build/native/native-arm64.tar -C build/arm64/out
          tar -xf build/native/native-x86_64.tar -C build/x86_64/out
          python tools/release/merge_macos.py --arm64 build/arm64/out --x86-64 build/x86_64/out --output build/universal/out
          version=$(python -c 'import re,pathlib; print(re.search(r"project\(Krose VERSION ([0-9.]+)", pathlib.Path("CMakeLists.txt").read_text())[1])')
          bash tools/release/package_macos.sh build/universal "$version"
      - name: Package and smoke test macOS standalone
        shell: bash
        run: |
          version=$(python -c 'import re,pathlib; print(re.search(r"project\(Krose VERSION ([0-9.]+)", pathlib.Path("CMakeLists.txt").read_text())[1])')
          python tools/release/package_standalone.py --input build/universal/out --version "$version" --platform macos-universal --output dist --smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Krose-macos-universal-standalone
          path: dist/*-app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: Krose-macos-universal
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Krose-windows-x64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: Krose-macos-universal
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: Krose-windows-x64-standalone
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: Krose-macos-universal-standalone
          path: dist
      - name: Package Ableton controller integration
        run: python3 tools/install_ableton_controller.py --archive "dist/Krose-${GITHUB_REF_NAME#v}-Ableton-KeyLab-Essential.zip"
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.pkg *.zip > SHA256SUMS.txt
          notes='Includes standalone, VST3, a built-in controller support kit and extension templates, plus KeyLab Essential mk3 Ableton integration. Controller profiles: LCD CTRL > INPUT > PROFILES. Manufacturer: maincore. macOS supports Apple Silicon and Intel. Installers are currently unsigned/not notarized.'
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              *.exe *.pkg *.zip SHA256SUMS.txt
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Krose $GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Krose $GITHUB_REF_NAME" --generate-notes --notes "$notes" \
              *.exe *.pkg *.zip SHA256SUMS.txt
          fi
