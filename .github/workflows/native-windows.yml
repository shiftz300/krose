name: Native Windows compile
on:
  push:
    paths: ['src/**', 'cmake/**', 'CMakeLists.txt', 'tools/bootstrap_plugin.py', 'tools/native-ui/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned dependencies
        run: python tools/bootstrap_plugin.py
      - name: Stage compile-only assets
        run: python tools/native-ui/ci_assets.py
      - name: Configure x64 native renderer
        run: >-
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF -DSEGRAND_BUILD_TOOLS=OFF
          -DSEGRAND_ASSET_DIR="${{ github.workspace }}/build/compile-assets/concert-se-grand"
          -DKROSE_FACTORY_ASSET_DIR="${{ github.workspace }}/build/compile-assets/program-library"
      - name: Compile VST3 and standalone
        run: cmake --build build/windows --config Release --target Krose-vst3 Krose-app --parallel 4
      # Do not upload nonfunctional builds containing placeholder PCM banks.
