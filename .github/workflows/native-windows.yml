name: Native compile and installer checks
on:
  push:
    paths: ['src/**', 'cmake/**', 'packaging/**', 'controllers/**', 'tests/**', 'CMakeLists.txt', 'tools/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure Visual Studio x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/windows_toolchain.ps1
      - name: Select LLVM for PGO configuration checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:/Program Files/LLVM/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Tooling regressions
        run: python -B -m unittest discover -s tests/tools
      - name: Read product version
        shell: bash
        run: |
          python - <<'PYCODE'
          import os,re
          from pathlib import Path
          version=re.search(r'project\(Krose VERSION ([0-9.]+)',Path('CMakeLists.txt').read_text())[1]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('KROSE_VERSION='+version+'\n')
          PYCODE
      - name: Fetch pinned dependencies
        run: python tools/bootstrap_plugin.py
      - name: Stage compile-only assets
        run: python tools/native-ui/ci_assets.py
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
          -DKROSE_ENABLE_IPO=ON -DKROSE_ENABLE_PGO=OFF -DBUILD_TESTING=OFF -DSEGRAND_BUILD_TOOLS=OFF
          -DSEGRAND_ASSET_DIR="${{ github.workspace }}/build/compile-assets/concert-se-grand"
          -DKROSE_FACTORY_ASSET_DIR="${{ github.workspace }}/build/compile-assets/program-library"
      - name: Configure macOS universal
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build/ci -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DKROSE_ENABLE_IPO=ON -DKROSE_ENABLE_PGO=OFF -DBUILD_TESTING=OFF -DSEGRAND_BUILD_TOOLS=OFF
          -DSEGRAND_ASSET_DIR="${{ github.workspace }}/build/compile-assets/concert-se-grand"
          -DKROSE_FACTORY_ASSET_DIR="${{ github.workspace }}/build/compile-assets/program-library"
      - name: Build Release
        run: cmake --build build/ci --config Release --target Krose-vst3 Krose-app --parallel 3
      - name: Check macOS installer structure
        # The kit is copied before signing and must not contain stale scripts.
        if: runner.os == 'macOS'
        run: bash tools/release/package_macos.sh build/ci "$KROSE_VERSION"
      - name: Verify built-in controller resources
        run: python tools/build_controller_resources.py --verify-output build/ci/out
      - name: Package Windows Inno installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/release/package_windows.ps1 -InputDirectory build/ci/out -Version $env:KROSE_VERSION -OutputDirectory dist
      - name: Check Inno install, migration and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/test_windows_installer.ps1 -Installer "dist/Krose-$env:KROSE_VERSION-windows-x64-setup.exe" -Version $env:KROSE_VERSION
      # Placeholder banks are never uploaded or published.
